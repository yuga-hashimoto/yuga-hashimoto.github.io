<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScreenClip</title>
    <meta
      name="description"
      content="ScreenClip is a mobile app that turns future screenshots into searchable AI notes."
    >
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f8fb;
        color: #172033;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 40px;
        line-height: 1.1;
      }

      p {
        margin: 0 0 16px;
        font-size: 17px;
        line-height: 1.7;
      }

      a {
        color: #0f62fe;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ScreenClip</h1>
      <p>
        ScreenClip は、これから撮影するスクリーンショットを AI メモ化し、
        端末内で検索できるモバイルアプリです。
      </p>
      <p>
        ScreenClip turns future screenshots into searchable AI notes while keeping
        local viewing and search available on device.
      </p>
      <p>
        <a href="https://gist.github.com/yuga-hashimoto/52e3f4582ab826e368d75f0f3d5fbe72">
          Privacy Policy
        </a>
      </p>
    </main>
  </body>
</html>
